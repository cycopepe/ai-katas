[project]
name = "ai-katas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["."]
